[project]
name = "comish"
version = "0.1.0"
description = "A citation-only rules assistant for dynasty fantasy league iMessage group chats"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["fantasy-football", "fantasy-basketball", "sleeper", "imessage", "bluebubbles", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
comish = "comish.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic punctuation in strings/comments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests
"scripts/**" = ["S603", "S607"]  # dev scripts call git from PATH

[tool.mypy]
python_version = "3.12"
packages = ["comish"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
