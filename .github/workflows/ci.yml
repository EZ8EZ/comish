name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: House style (no em or en dashes)
        run: uv run python scripts/check_text.py
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Test
        run: uv run pytest -q
      - name: Validate launchd plist
        run: uv run python -c "import plistlib; plistlib.load(open('deploy/launchd/com.comish.server.plist', 'rb'))"
