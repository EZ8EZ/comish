# A synthetic example set (no real league data) showing the case format.
# Real sets go in data/<slug>/evals/cases.yaml.
cases:
  - id: ex-deadline
    question: When is the trade deadline?
    expected: answer
    category: setting_lookup
    must_include: ["week 11"]
    acceptable_sources: ["sleeper:settings.trade_deadline"]
  - id: ex-taxi
    question: Can taxi squad players be traded during the season?
    expected: answer
    category: rule_lookup
    must_include: ["offseason"]
    acceptable_sources: ["Constitution > Trades > 4.2"]
  - id: ex-superseded
    question: How many taxi slots does each team get?
    expected: abstain
    category: superseded_rule
    notes: The 2023 doc says 2, a 2024 vote screenshot says 3, and no supersession link is approved yet.
  - id: ex-bonus-change
    question: When did we remove scoring bonuses for big plays?
    expected: answer
    category: history_lookup
    must_include: ["2024", "2025"]
    acceptable_sources: ["sleeper:scoring_settings.rec_40p", "sleeper:scoring_settings.rush_40p"]
    notes: >-
      Sleeper only knows the season, so the right answer is "between the 2024 and 2025
      seasons", never a date, unless an approved vote or ruling dates it. It must also
      correct the premise: 40+ yard bonuses were removed, 50+ yard TD bonuses only cut.
