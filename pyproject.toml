[project]
name = "commish"
version = "0.0.1"
description = "Commish Bot: a citation-only rules assistant for dynasty league iMessage group chats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
commish = "commish.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
